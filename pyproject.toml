description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arpitbansal08", email = "101734269+arpitbansal08@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=4.1.4",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.17",
    "langsmith>=0.14.12",
